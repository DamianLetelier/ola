{% extends "crud_Matias/base.html" %}

{% block title %}Formulario de Empleado{% endblock %}

{% block content %}
<h1 class="mb-4">Formulario de Empleado</h1>

<form method="post" enctype="multipart/form-data" class="bg-white p-4 rounded shadow-sm">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="mt-3">
        <button type="submit" class="btn btn-success">Guardar</button>
        <a href="{% url 'lista_empleados' %}" class="btn btn-secondary ms-2">Cancelar</a>
    </div>
</form>
{% endblock %}
